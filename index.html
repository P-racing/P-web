<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="웹사이트 설명을 입력하세요.">
  <title>나의 웹사이트</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="js/main.js" defer></script>
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a class="brand" href="#home">나의 웹사이트</a>
      <!-- 로고를 넣으려면 위 문구 대신 아래 코드를 사용하세요.
      <a class="brand" href="#home"><img src="assets/logo.png" alt="사이트 이름"></a>
      -->
      <nav aria-label="주 메뉴">
        <a href="#about">소개</a>
        <a href="#content">콘텐츠</a>
        <a href="#contact">연락처</a>
      </nav>
    </div>
  </header>

  <main id="home">
    <section class="hero">
      <div class="container">
        <p class="eyebrow">WELCOME</p>
        <h1>웹사이트를 만들어 보세요</h1>
        <p>이곳에 사이트를 소개하는 문구를 입력하세요.</p>
        <a class="button" href="#about">자세히 보기</a>
      </div>
    </section>

    <section class="section container" id="about">
      <h2>소개</h2>
      <p>사이트나 팀에 대한 소개를 작성하세요.</p>
    </section>

    <section class="section section-alt" id="content">
      <div class="container">
        <h2>콘텐츠</h2>
        <p>사진, 프로젝트 또는 원하는 내용을 추가하세요.</p>
      </div>
    </section>

    <section class="section container" id="contact">
      <h2>연락처</h2>
      <p>연락할 수 있는 방법을 입력하세요.</p>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container">© <span id="year"></span> 나의 웹사이트</div>
  </footer>
</body>
</html>
